[project]
name = "jens_jugs"
version = "0.1.0"
description = ""
authors = [
    {name = "Jenova Marie",email = "jenova@recoverysky.org"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests (>=2.32.3,<3.0.0)",
    "flask (==2.3.3)",
    "redis (==5.0.3)",
    "openai (==1.14.2)",
    "python-dotenv (==1.0.1)",
    "httpx (>=0.23.0,<0.24.0)",
    "click (>=8.1.8,<9.0.0)"
]

[tool.poetry]
packages = [{include = "jens_jugs", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
